# Local infrastructure for ZetaX: Kafka (single broker, KRaft) + PostgreSQL.
# The two Spring Boot apps run from your IDE / mvn for now (Dockerfiles come in phase 4).
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: zetax-kafka
    ports:
      - "9092:9092"            # for apps on your Mac: localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by kafka-init only
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topics once Kafka is healthy (D-11, D-18), then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: zetax-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic commands --partitions 3 --replication-factor 1 --config retention.ms=-1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic trades --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe
    restart: "no"

  postgres:
    image: postgres:16
    container_name: zetax-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: zetax
      POSTGRES_USER: zetax
      POSTGRES_PASSWORD: zetax
    volumes:
      - zetax-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zetax -d zetax"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  zetax-pg:
