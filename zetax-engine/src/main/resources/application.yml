server:
  port: 8081

spring:
  application:
    name: zetax-engine
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

zetax:
  engine:
    partitions: 3   # D-18, must match the commands topic
