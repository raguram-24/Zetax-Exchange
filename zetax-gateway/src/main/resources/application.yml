server:
  port: 8080

spring:
  application:
    name: zetax-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/zetax
    username: zetax
    password: zetax
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

zetax:
  admin:
    key: ${ZETAX_ADMIN_KEY:change-me}   # D-20, X-Admin-Key header
